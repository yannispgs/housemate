# SonarCloud Automatic Analysis reads this file (there is no scanner step and no
# sonar-project.properties — the GitHub App analyses every push itself).
#
# Only the analysis SCOPE can be set here: on the free plan, Quality Profiles
# are read-only, so a single rule cannot be silenced. Anything that cannot be
# excluded as a whole file is answered in the code with a `NOSONAR` and the
# reason it is there.
#
# Both exclusions are inherited from Boardmate, same stack, and apply as soon as
# Supabase lands:
#   - migrations are PostgreSQL, but Sonar only ships an Oracle PL/SQL analyser
#     and applies it to every .sql file — dialect mismatches, never defects.
#     Migrations are exercised by the integration suite against a real database.
#   - database.types.ts is generated by `supabase gen types`; any edit is undone
#     by the next generation.
#   - .yarn/releases holds the Yarn release itself (yarnPath), vendored so
#     that Vercel's Yarn 1 hands over to it; third-party, minified.
sonar.exclusions=supabase/migrations/**,src/lib/supabase/database.types.ts,.yarn/**
