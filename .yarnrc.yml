# Use the classic node_modules layout (not Plug'n'Play) for max compatibility
# with Next.js and its toolchain.
nodeLinker: node-modules

# Yarn ships with the repo: Vercel installs with its own Yarn 1, which ignores
# `packageManager` and cannot read a Yarn 4 yarn.lock, so it resolved fresh
# versions — a half-published release broke a preview (#55, 2026-11-05).
# Yarn 1 hands over to this file as soon as it sees `yarnPath`.
yarnPath: .yarn/releases/yarn-4.16.0.cjs
